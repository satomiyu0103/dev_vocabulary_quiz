<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>開発語彙 4択クイズ</title>
  <style>
    :root {
      --bg-page: #EDECEA;
      --bg-surface: #FAFAF8;
      --text: #1A2332;
      --text-muted: #4A5568;
      --border: #C8CDD4;
      --primary: #2B6CB0;
      --primary-hover: #245A92;
      --primary-light: #E8F0FA;
      --success: #0D6E6E;
      --success-bg: #E6F4F1;
      --warning: #B45309;
      --warning-bg: #FEF3E6;
      --focus-yellow: #FFEE00;
      --radius: 8px;
      --font: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      --mono: ui-monospace, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      font-size: 1.0625rem;
      line-height: 1.65;
      color: var(--text);
      background: var(--bg-page);
    }
    a { color: var(--primary); text-decoration: underline; text-underline-offset: 3px; }
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--focus-yellow);
      outline-offset: 2px;
      box-shadow: 0 0 0 2px #000;
    }
    .site-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.25rem;
    }
    .site-header h1 { font-size: 1.25rem; font-weight: 700; margin: 0; }
    .site-header .sub { margin: 0.25rem 0 0; font-size: 0.875rem; color: var(--text-muted); }
    .top-link {
      flex-shrink: 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    .top-link:hover { background: var(--primary-light); }
    .top-link.hidden { display: none; }
    main { max-width: 640px; margin: 0 auto; padding: 1rem 1.25rem 2rem; }
    .panel, .dads-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .dads-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      border-bottom: 2px solid var(--border);
      margin-bottom: 1rem;
    }
    .dads-tab {
      font: inherit;
      font-weight: 500;
      padding: 0.65rem 0.85rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      min-height: 44px;
    }
    .dads-tab[aria-selected="true"] {
      color: var(--primary);
      font-weight: 700;
      border-bottom-color: var(--primary);
      background: var(--primary-light);
    }
    .dads-segment {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .dads-btn {
      font: inherit;
      font-weight: 500;
      min-height: 44px;
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .dads-btn--outline {
      background: var(--bg-surface);
      border: 1px solid var(--primary);
      color: var(--primary);
    }
    .dads-btn--outline.is-active {
      background: var(--primary);
      color: #fff;
    }
    .dads-btn--outline:hover:not(.is-active) { background: var(--primary-light); }
    .dads-btn--filled {
      background: var(--primary);
      border: 1px solid var(--primary);
      color: #fff;
      width: 100%;
      font-weight: 700;
    }
    .dads-btn--filled:hover { background: var(--primary-hover); }
    .dads-btn--choice {
      width: 100%;
      text-align: left;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      font-size: 1.05rem;
    }
    .dads-btn--choice:hover:not(:disabled) {
      background: var(--primary-light);
      border-color: var(--primary);
    }
    .dads-btn--choice.is-correct {
      border: 2px solid var(--success);
      background: var(--success-bg);
    }
    .dads-btn--choice.is-wrong {
      border: 2px dashed var(--warning);
      background: var(--warning-bg);
    }
    .dads-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .dads-card__label {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text-muted);
      margin: 0 0 0.5rem;
    }
    .dads-card__prompt {
      font-size: 1.0625rem;
      font-weight: 700;
      margin: 0 0 1rem;
    }
    .dads-notice {
      padding: 0.75rem 1rem;
      margin: 0.5rem 0;
      border-left: 4px solid var(--primary);
      background: var(--primary-light);
      border-radius: 0 var(--radius) var(--radius) 0;
      font-size: 0.9375rem;
    }
    .dads-notice strong {
      display: block;
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-bottom: 0.15rem;
    }
    .choices { display: grid; gap: 0.5rem; margin-top: 1rem; }
    .stats { font-size: 0.8125rem; color: var(--text-muted); margin: 0 0 1rem; }
    .result-line { font-size: 1.25rem; font-weight: 700; margin: 0 0 1rem; }
    .result-line--ok { color: var(--success); }
    .result-line--ng { color: var(--warning); }
    .explain dt { font-weight: 700; font-size: 0.875rem; margin-top: 0.75rem; }
    .explain dd { margin: 0.15rem 0 0; }
    .explain code {
      display: block;
      font-family: var(--mono);
      font-size: 0.875rem;
      background: var(--bg-page);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      margin-top: 0.25rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .examples { margin: 0.35rem 0 0; padding-left: 1.25rem; }
    .examples li { margin: 0.35rem 0; }
    .hidden { display: none; }
    #load-hint { font-size: 0.9rem; color: var(--text-muted); }
    #q-term { font-size: 1.35rem; font-weight: 700; margin: 0 0 0.75rem; }
    #setup button { min-height: 44px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div>
      <h1>開発語彙 4択クイズ</h1>
      <p class="sub">日常の意味とプログラミングでの意味をセットで学ぶ</p>
    </div>
    <a href="#" id="top-link" class="top-link hidden" aria-label="トップページに戻る">トップに戻る</a>
  </header>

  <main>
    <div id="setup" class="panel">
      <p id="load-hint">同じフォルダの <code>all_cards_v2.json</code> を読み込みます。</p>
      <input type="file" id="file-input" accept=".json" class="hidden">
      <button type="button" class="dads-btn dads-btn--outline" id="pick-file">JSON を選ぶ</button>
      <button type="button" class="dads-btn dads-btn--outline hidden" id="retry-fetch">再読み込み</button>
    </div>

    <div id="quiz" class="hidden">
      <nav class="dads-tabs" id="modes" role="tablist" aria-label="クイズモード">
        <button type="button" class="dads-tab" role="tab" data-mode="basic" aria-selected="true">基本の動詞・名詞</button>
        <button type="button" class="dads-tab" role="tab" data-mode="anti" aria-selected="false">単体の汎用名</button>
        <button type="button" class="dads-tab" role="tab" data-mode="lib" aria-selected="false">ライブラリ・API</button>
        <button type="button" class="dads-tab" role="tab" data-mode="p2" aria-selected="false">プロジェクト語彙（P2）</button>
        <button type="button" class="dads-tab" role="tab" data-mode="pattern" aria-selected="false">命名パターン</button>
        <button type="button" class="dads-tab" role="tab" data-mode="ds" aria-selected="false">データ分析（DS）</button>
      </nav>

      <div class="dads-segment" id="directions" role="group" aria-label="出題方向">
        <button type="button" class="dads-btn dads-btn--outline is-active" data-direction="ja2en">日→英</button>
        <button type="button" class="dads-btn dads-btn--outline" data-direction="en2ja">英→日</button>
        <button type="button" class="dads-btn dads-btn--outline" data-direction="mixed">ミックス</button>
      </div>

      <p class="stats" id="stats"></p>

      <section id="question-panel" class="dads-card" aria-labelledby="q-label">
        <p class="dads-card__label" id="q-label"></p>
        <p class="dads-card__prompt" id="q-prompt">次の説明に合う英単語はどれ？</p>
        <p id="q-term" class="hidden"></p>
        <div id="meaning-blocks"></div>
        <div class="choices" id="choices" role="group" aria-label="選択肢"></div>
      </section>

      <section id="feedback-panel" class="dads-card hidden">
        <p id="result-line" class="result-line"></p>
        <dl class="explain" id="explain"></dl>
        <button type="button" class="dads-btn dads-btn--filled" id="next-btn">次の問題</button>
      </section>
    </div>
  </main>

  <script>
    const MODE_LABELS = {
      basic: "基本の動詞・名詞",
      anti: "単体の汎用名",
      lib: "ライブラリ・API",
      p2: "プロジェクト語彙（P2）",
      pattern: "命名パターン",
      ds: "データ分析（DS）",
    };

    const DIRECTION_LABELS = {
      ja2en: "日→英",
      en2ja: "英→日",
      mixed: "ミックス",
    };

    let allCards = [];
    let pool = [];
    let current = null;
    let choices = [];
    let correctIndex = -1;
    let mode = "basic";
    let questionDirection = "ja2en";
    let effectiveDirection = "ja2en";
    let meaningKind = "general";
    let questionNum = 0;
    let usedIds = new Set();
    let answered = false;

    const $ = (id) => document.getElementById(id);

    function getMeaningText(card, kind) {
      if (kind === "general") {
        return card.meaning_general_ja || "—";
      }
      return card.meaning_programming_ja || "—";
    }

    function resolveEffectiveDirection() {
      if (questionDirection === "mixed") {
        return Math.random() < 0.5 ? "ja2en" : "en2ja";
      }
      return questionDirection;
    }

    function filterCards(cards) {
      if (mode === "basic") {
        return cards.filter((c) => c.type === "identifier" && c.tier === "P0");
      }
      if (mode === "anti") {
        return cards.filter((c) => c.type === "anti_pattern");
      }
      if (mode === "lib") {
        return cards.filter((c) => c.type === "method" || c.type === "package" || c.type === "stdlib");
      }
      if (mode === "p2") {
        return cards.filter((c) => c.type === "identifier" && c.tier === "P2");
      }
      if (mode === "pattern") {
        return cards.filter((c) => c.type === "pattern");
      }
      if (mode === "ds") {
        return cards.filter((c) => c.type === "identifier" && c.tier === "DS");
      }
      return [];
    }

    function pickDistractors(card, candidates) {
      const terms = new Set([card.term]);
      const out = [];
      const related = [
        ...(card.confusable_with || []).map((x) => x.term),
        ...(card.related_terms || []),
      ];
      for (const t of related) {
        if (!terms.has(t) && candidates.some((c) => c.term === t)) {
          out.push(t);
          terms.add(t);
        }
        if (out.length >= 3) break;
      }
      for (const c of shuffle(candidates)) {
        if (out.length >= 3) break;
        if (!terms.has(c.term)) {
          out.push(c.term);
          terms.add(c.term);
        }
      }
      while (out.length < 3) out.push("—");
      return out.slice(0, 3);
    }

    function pickDistractorsJa(card, candidates, kind) {
      const correctText = getMeaningText(card, kind);
      const texts = new Set([correctText]);
      const out = [];
      const relatedTerms = [
        ...(card.confusable_with || []).map((x) => x.term),
        ...(card.related_terms || []),
      ];
      for (const term of relatedTerms) {
        const relatedCard = candidates.find((c) => c.term === term);
        if (!relatedCard) continue;
        const text = getMeaningText(relatedCard, kind);
        if (!text || text === "—" || texts.has(text)) continue;
        out.push(text);
        texts.add(text);
        if (out.length >= 3) break;
      }
      for (const c of shuffle(candidates)) {
        if (out.length >= 3) break;
        const text = getMeaningText(c, kind);
        if (!text || text === "—" || texts.has(text)) continue;
        out.push(text);
        texts.add(text);
      }
      while (out.length < 3) out.push("—");
      return out.slice(0, 3);
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function refreshPool() {
      pool = filterCards(allCards).filter((c) => !usedIds.has(c.id));
      if (pool.length === 0) {
        usedIds.clear();
        pool = filterCards(allCards);
      }
    }

    function setMeaningNotice(container, labelText, bodyText) {
      const notice = document.createElement("div");
      notice.className = "dads-notice";
      const label = document.createElement("strong");
      label.textContent = labelText;
      notice.appendChild(label);
      notice.appendChild(document.createTextNode(bodyText));
      container.appendChild(notice);
    }

    function nextQuestion() {
      answered = false;
      $("feedback-panel").classList.add("hidden");
      $("question-panel").classList.remove("hidden");
      refreshPool();
      if (pool.length === 0) {
        $("q-label").textContent = "カードがありません";
        return;
      }
      current = pool[Math.floor(Math.random() * pool.length)];
      questionNum += 1;
      effectiveDirection = resolveEffectiveDirection();
      const candidates = filterCards(allCards);

      const qPrompt = $("q-prompt");
      const qTerm = $("q-term");
      const meaningBlocks = $("meaning-blocks");
      meaningBlocks.replaceChildren();

      if (effectiveDirection === "ja2en") {
        qPrompt.textContent = "次の説明に合う英単語はどれ？";
        qTerm.classList.add("hidden");
        setMeaningNotice(meaningBlocks, "日常の意味", current.meaning_general_ja || "—");
        setMeaningNotice(meaningBlocks, "プログラミングでの意味", current.meaning_programming_ja || "—");
        const distractors = pickDistractors(current, candidates);
        choices = shuffle([current.term, ...distractors]);
        correctIndex = choices.indexOf(current.term);
      } else {
        meaningKind = Math.random() < 0.5 ? "general" : "programming";
        const kindLabel = meaningKind === "general" ? "日常の意味" : "プログラミングでの意味";
        qPrompt.textContent = `この単語の意味として正しいのはどれ？（${kindLabel}）`;
        qTerm.textContent = current.term;
        qTerm.classList.remove("hidden");
        const correctText = getMeaningText(current, meaningKind);
        const distractors = pickDistractorsJa(current, candidates, meaningKind);
        choices = shuffle([correctText, ...distractors]);
        correctIndex = choices.indexOf(correctText);
      }

      const directionNote =
        questionDirection === "mixed"
          ? ` · この問題: ${DIRECTION_LABELS[effectiveDirection]}`
          : "";
      $("q-label").textContent = `【問題 ${questionNum}】${MODE_LABELS[mode]}${directionNote}`;

      const box = $("choices");
      box.replaceChildren();
      choices.forEach((choiceText, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "dads-btn dads-btn--choice";
        btn.textContent = `${"ABCD"[i]}) ${choiceText}`;
        btn.addEventListener("click", () => answer(i, btn));
        box.appendChild(btn);
      });
      updateStats();
    }

    function answer(index, btn) {
      if (answered) return;
      answered = true;
      const buttons = $("choices").querySelectorAll(".dads-btn--choice");
      buttons.forEach((b) => (b.disabled = true));
      const ok = index === correctIndex;
      if (ok) btn.classList.add("is-correct");
      else {
        btn.classList.add("is-wrong");
        buttons[correctIndex].classList.add("is-correct");
      }
      showFeedback(ok);
    }

    function appendExplainRow(explainRoot, labelText, valueNode) {
      const label = document.createElement("dt");
      label.textContent = labelText;
      const value = document.createElement("dd");
      value.appendChild(valueNode);
      explainRoot.appendChild(label);
      explainRoot.appendChild(value);
    }

    function buildExampleList(exampleRows) {
      if (!exampleRows.length) {
        const emptyText = document.createElement("span");
        emptyText.textContent = "—";
        return emptyText;
      }
      const list = document.createElement("ul");
      list.className = "examples";
      exampleRows.forEach((row) => {
        const item = document.createElement("li");
        const english = row.en || "";
        const japanese = row.ja ? `（${row.ja}）` : "";
        item.textContent = `${english}${japanese}`;
        list.appendChild(item);
      });
      return list;
    }

    function showFeedback(ok) {
      $("question-panel").classList.add("hidden");
      $("feedback-panel").classList.remove("hidden");
      const line = $("result-line");
      if (ok) {
        line.textContent = "【結果】正解！";
        line.className = "result-line result-line--ok";
      } else {
        const correctLabel = `${"ABCD"[correctIndex]}) ${choices[correctIndex]}`;
        line.textContent = `【結果】不正解（正解は ${correctLabel}）`;
        line.className = "result-line result-line--ng";
      }

      const exampleRows = (current.examples_general || []).slice(0, 2);
      const codeExample = (current.examples_code || [])[0];
      const explainRoot = $("explain");
      explainRoot.replaceChildren();

      const termStrong = document.createElement("strong");
      termStrong.textContent = current.term;
      appendExplainRow(explainRoot, "単語", termStrong);
      appendExplainRow(
        explainRoot,
        "日常の意味",
        document.createTextNode(current.meaning_general_ja || "—")
      );
      appendExplainRow(
        explainRoot,
        "プログラミングでの意味",
        document.createTextNode(current.meaning_programming_ja || "—")
      );
      appendExplainRow(
        explainRoot,
        "コードもしくはプログラミングでの使われ方",
        document.createTextNode(current.usage_note_ja || "—")
      );
      appendExplainRow(explainRoot, "日常英語の例文", buildExampleList(exampleRows));

      const codeBlock = document.createElement("code");
      codeBlock.textContent = codeExample ? codeExample.snippet : "—";
      appendExplainRow(explainRoot, "コードでの例", codeBlock);

      usedIds.add(current.id);
      updateStats();
    }

    function updateStats() {
      const total = filterCards(allCards).length;
      $("stats").textContent =
        `出題済み ${usedIds.size} / ${total} 語 · モード: ${MODE_LABELS[mode]} · 方向: ${DIRECTION_LABELS[questionDirection]}`;
    }

    function startQuiz(cards) {
      allCards = cards;
      usedIds.clear();
      questionNum = 0;
      $("setup").classList.add("hidden");
      $("quiz").classList.remove("hidden");
      $("top-link").classList.remove("hidden");
      nextQuestion();
    }

    function setActiveTab(activeButton) {
      document.querySelectorAll(".dads-tab").forEach((tabButton) => {
        const isActive = tabButton === activeButton;
        tabButton.setAttribute("aria-selected", isActive ? "true" : "false");
      });
    }

    function setActiveDirection(activeButton) {
      document.querySelectorAll("#directions .dads-btn--outline").forEach((dirButton) => {
        dirButton.classList.toggle("is-active", dirButton === activeButton);
      });
    }

    $("top-link").addEventListener("click", (event) => {
      event.preventDefault();
      window.location.reload();
    });

    async function loadJson() {
      try {
        const res = await fetch("./all_cards_v2.json");
        if (!res.ok) throw new Error("fetch failed");
        const data = await res.json();
        startQuiz(data.cards || data);
        return true;
      } catch {
        return false;
      }
    }

    $("pick-file").addEventListener("click", () => $("file-input").click());
    $("file-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const data = JSON.parse(await file.text());
      startQuiz(data.cards || data);
    });
    $("next-btn").addEventListener("click", nextQuestion);
    $("modes").addEventListener("click", (e) => {
      const btn = e.target.closest(".dads-tab");
      if (!btn) return;
      setActiveTab(btn);
      mode = btn.dataset.mode;
      usedIds.clear();
      questionNum = 0;
      nextQuestion();
    });

    $("directions").addEventListener("click", (e) => {
      const btn = e.target.closest(".dads-btn--outline");
      if (!btn) return;
      setActiveDirection(btn);
      questionDirection = btn.dataset.direction;
      usedIds.clear();
      questionNum = 0;
      nextQuestion();
    });

    loadJson().then((ok) => {
      if (!ok) {
        $("load-hint").textContent =
          "ファイルを直接開いた場合は下のボタンで all_cards_v2.json を選んでください。または public フォルダで python -m http.server 8080 を実行して http://localhost:8080/ を開く。";
      }
    });
  </script>
</body>
</html>
