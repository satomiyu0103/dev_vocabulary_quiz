<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>開発語彙 4択クイズ</title>
  <style>
    :root {
      --bg: #eef1f5;
      --card: #fff;
      --text: #0f1419;
      --muted: #3d4a56;
      --ok: #0a6b40;
      --bad: #9f1f16;
      --accent: #1d4ed8;
      --border: #c5cdd6;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem;
      font-size: 1.0625rem;
      line-height: 1.65;
    }
    main { max-width: 640px; margin: 0 auto; }
    .site-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin: 0; line-height: 1.3; }
    .sub { color: var(--muted); font-size: 1rem; margin: 0.35rem 0 1rem; }
    .top-link {
      flex-shrink: 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
    }
    .top-link:hover { background: #e8eefc; }
    .top-link.hidden { display: none; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }
    .mode-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    button, .choice {
      font: inherit;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      padding: 0.55rem 0.9rem;
    }
    button.mode.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      width: 100%;
      margin-top: 0.75rem;
      font-weight: 600;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .choices { display: grid; gap: 0.5rem; margin: 1rem 0; }
    .choice {
      text-align: left;
      width: 100%;
      transition: background 0.15s;
    }
    .choice:hover:not(:disabled) { background: #eef4ff; }
    .choice.correct { border-color: var(--ok); background: #ecfdf3; }
    .choice.wrong { border-color: var(--bad); background: #fef3f2; }
    .result { font-weight: 800; font-size: 1.25rem; }
    .result.ok { color: var(--ok); }
    .result.ng { color: var(--bad); }
    #q-label { font-size: 1.05rem; font-weight: 700; margin: 0 0 0.5rem; }
    #question-panel strong { font-size: 1.1rem; }
    #q-general, #q-prog {
      font-size: 1.05rem;
      margin: 0.5rem 0;
      padding: 0.65rem 0.75rem;
      background: #f3f6fa;
      border-left: 4px solid var(--accent);
      border-radius: 4px;
    }
    .choice { font-size: 1.05rem; font-weight: 500; }
    .explain dt {
      font-weight: 700;
      margin-top: 0.75rem;
      color: var(--text);
      font-size: 0.95rem;
      text-transform: none;
    }
    .explain dd { margin: 0.2rem 0 0; font-size: 1.02rem; }
    .examples { margin: 0.35rem 0 0; padding-left: 1.25rem; }
    .examples li { margin: 0.35rem 0; }
    code {
      display: block;
      background: #e8ecf2;
      color: #0f1419;
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      font-size: 0.95em;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .hidden { display: none; }
    #load-hint { font-size: 0.9rem; color: var(--muted); }
    .stats { font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header class="site-header">
      <div>
        <h1>開発語彙 4択クイズ</h1>
        <p class="sub">日常の意味とプログラミングでの意味をセットで学ぶ。</p>
      </div>
      <a href="#" id="top-link" class="top-link hidden" aria-label="トップページに戻る">トップに戻る</a>
    </header>

    <div id="setup" class="panel">
      <p id="load-hint">同じフォルダの <code>all_cards_v2.json</code> を読み込みます。</p>
      <input type="file" id="file-input" accept=".json" class="hidden">
      <button type="button" id="pick-file">JSON を選ぶ</button>
      <button type="button" id="retry-fetch" class="hidden">再読み込み</button>
    </div>

    <div id="quiz" class="hidden">
      <div class="mode-bar" id="modes">
        <button type="button" class="mode active" data-mode="basic">基本の動詞・名詞</button>
        <button type="button" class="mode" data-mode="anti">単体の汎用名</button>
        <button type="button" class="mode" data-mode="lib">ライブラリ・API</button>
      </div>
      <p class="stats" id="stats"></p>

      <div id="question-panel" class="panel">
        <p id="q-label"></p>
        <p><strong>次の説明に合う英単語はどれ？</strong></p>
        <p id="q-general"></p>
        <p id="q-prog"></p>
        <div class="choices" id="choices"></div>
      </div>

      <div id="feedback-panel" class="panel hidden">
        <p id="result-line" class="result"></p>
        <dl class="explain" id="explain"></dl>
        <button type="button" class="primary" id="next-btn">次の問題</button>
      </div>
    </div>
  </main>

  <script>
    const MODE_LABELS = {
      basic: "基本の動詞・名詞",
      anti: "単体の汎用名",
      lib: "ライブラリ・API",
    };

    let allCards = [];
    let pool = [];
    let current = null;
    let choices = [];
    let correctIndex = -1;
    let mode = "basic";
    let questionNum = 0;
    let usedIds = new Set();
    let answered = false;

    const $ = (id) => document.getElementById(id);

    function filterCards(cards) {
      if (mode === "basic") {
        return cards.filter((c) => c.type === "identifier" && c.tier === "P0");
      }
      if (mode === "anti") {
        return cards.filter((c) => c.type === "anti_pattern");
      }
      return cards.filter((c) => c.type === "method" || c.type === "package" || c.type === "stdlib");
    }

    function pickDistractors(card, candidates) {
      const terms = new Set([card.term]);
      const out = [];
      const related = [
        ...(card.confusable_with || []).map((x) => x.term),
        ...(card.related_terms || []),
      ];
      for (const t of related) {
        if (!terms.has(t) && candidates.some((c) => c.term === t)) {
          out.push(t);
          terms.add(t);
        }
        if (out.length >= 3) break;
      }
      for (const c of shuffle(candidates)) {
        if (out.length >= 3) break;
        if (!terms.has(c.term)) {
          out.push(c.term);
          terms.add(c.term);
        }
      }
      while (out.length < 3) out.push("—");
      return out.slice(0, 3);
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function refreshPool() {
      pool = filterCards(allCards).filter((c) => !usedIds.has(c.id));
      if (pool.length === 0) {
        usedIds.clear();
        pool = filterCards(allCards);
      }
    }

    function nextQuestion() {
      answered = false;
      $("feedback-panel").classList.add("hidden");
      $("question-panel").classList.remove("hidden");
      refreshPool();
      if (pool.length === 0) {
        $("q-label").textContent = "カードがありません";
        return;
      }
      current = pool[Math.floor(Math.random() * pool.length)];
      questionNum += 1;
      const candidates = filterCards(allCards);
      const distractors = pickDistractors(current, candidates);
      choices = shuffle([current.term, ...distractors]);
      correctIndex = choices.indexOf(current.term);

      $("q-label").textContent = `【問題 ${questionNum}】${MODE_LABELS[mode]}`;
      $("q-general").textContent = `■ 日常の意味: ${current.meaning_general_ja || "—"}`;
      $("q-prog").textContent = `■ プログラミングでの意味: ${current.meaning_programming_ja || "—"}`;

      const box = $("choices");
      box.innerHTML = "";
      choices.forEach((term, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice";
        btn.textContent = `${"ABCD"[i]}) ${term}`;
        btn.addEventListener("click", () => answer(i, btn));
        box.appendChild(btn);
      });
      updateStats();
    }

    function answer(index, btn) {
      if (answered) return;
      answered = true;
      const buttons = $("choices").querySelectorAll(".choice");
      buttons.forEach((b) => (b.disabled = true));
      const ok = index === correctIndex;
      if (ok) btn.classList.add("correct");
      else {
        btn.classList.add("wrong");
        buttons[correctIndex].classList.add("correct");
      }
      showFeedback(ok);
    }

    function appendExplainRow(explainRoot, labelText, valueNode) {
      const label = document.createElement("dt");
      label.textContent = labelText;
      const value = document.createElement("dd");
      value.appendChild(valueNode);
      explainRoot.appendChild(label);
      explainRoot.appendChild(value);
    }

    function buildExampleList(exampleRows) {
      if (!exampleRows.length) {
        const emptyText = document.createElement("span");
        emptyText.textContent = "—";
        return emptyText;
      }
      const list = document.createElement("ul");
      list.className = "examples";
      exampleRows.forEach((row) => {
        const item = document.createElement("li");
        const english = row.en || "";
        const japanese = row.ja ? `（${row.ja}）` : "";
        item.textContent = `${english}${japanese}`;
        list.appendChild(item);
      });
      return list;
    }

    function showFeedback(ok) {
      $("question-panel").classList.add("hidden");
      $("feedback-panel").classList.remove("hidden");
      const line = $("result-line");
      line.textContent = ok ? "【結果】正解！" : `【結果】不正解（正解は ${"ABCD"[correctIndex]}）`;
      line.className = "result " + (ok ? "ok" : "ng");

      const exampleRows = (current.examples_general || []).slice(0, 2);
      const codeExample = (current.examples_code || [])[0];
      const explainRoot = $("explain");
      explainRoot.replaceChildren();

      const termStrong = document.createElement("strong");
      termStrong.textContent = current.term;
      appendExplainRow(explainRoot, "単語", termStrong);
      appendExplainRow(
        explainRoot,
        "日常の意味",
        document.createTextNode(current.meaning_general_ja || "—")
      );
      appendExplainRow(
        explainRoot,
        "プログラミングでの意味",
        document.createTextNode(current.meaning_programming_ja || "—")
      );
      appendExplainRow(
        explainRoot,
        "プロでの使われ方",
        document.createTextNode(current.usage_note_ja || "—")
      );
      appendExplainRow(explainRoot, "日常英語の例文", buildExampleList(exampleRows));

      const codeBlock = document.createElement("code");
      codeBlock.textContent = codeExample ? codeExample.snippet : "—";
      appendExplainRow(explainRoot, "コードでの例", codeBlock);

      usedIds.add(current.id);
      updateStats();
    }

    function updateStats() {
      const total = filterCards(allCards).length;
      $("stats").textContent = `モード: ${MODE_LABELS[mode]} · 出題済み ${usedIds.size} / ${total} 語`;
    }

    function startQuiz(cards) {
      allCards = cards;
      usedIds.clear();
      questionNum = 0;
      $("setup").classList.add("hidden");
      $("quiz").classList.remove("hidden");
      $("top-link").classList.remove("hidden");
      nextQuestion();
    }

    $("top-link").addEventListener("click", (event) => {
      event.preventDefault();
      window.location.reload();
    });

    async function loadJson() {
      try {
        const res = await fetch("./all_cards_v2.json");
        if (!res.ok) throw new Error("fetch failed");
        const data = await res.json();
        startQuiz(data.cards || data);
        return true;
      } catch {
        return false;
      }
    }

    $("pick-file").addEventListener("click", () => $("file-input").click());
    $("file-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const data = JSON.parse(await file.text());
      startQuiz(data.cards || data);
    });
    $("next-btn").addEventListener("click", nextQuestion);
    $("modes").addEventListener("click", (e) => {
      const btn = e.target.closest(".mode");
      if (!btn) return;
      document.querySelectorAll(".mode").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      mode = btn.dataset.mode;
      usedIds.clear();
      questionNum = 0;
      nextQuestion();
    });

    loadJson().then((ok) => {
      if (!ok) {
        $("load-hint").textContent =
          "ファイルを直接開いた場合は下のボタンで all_cards_v2.json を選んでください。または export フォルダで python -m http.server 8080 を実行して http://localhost:8080/quiz.html を開く。";
      }
    });
  </script>
</body>
</html>
